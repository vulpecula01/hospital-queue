<!DOCTYPE html>
<html lang="th">
<head>
    <script src="auth-check.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เปลี่ยนรหัสผ่าน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-5">

    <div class="max-w-sm w-full">
        <div class="text-center mb-6">
            <div class="text-5xl mb-3">🔑</div>
            <h1 class="text-2xl font-black text-blue-400">เปลี่ยนรหัสผ่าน</h1>
        </div>

        <form id="change-form" class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl space-y-4">
            <div>
                <label class="block text-sm text-slate-400 mb-1">รหัสผ่านปัจจุบัน</label>
                <input type="password" id="current-password" required
                       class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-1">รหัสผ่านใหม่</label>
                <input type="password" id="new-password" required minlength="6"
                       class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-blue-500">
                <p class="text-xs text-slate-500 mt-1">อย่างน้อย 6 ตัวอักษร</p>
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-1">ยืนยันรหัสผ่านใหม่</label>
                <input type="password" id="confirm-password" required minlength="6"
                       class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-blue-500">
            </div>

            <p id="result-msg" class="hidden text-center text-sm font-bold p-3 rounded-xl"></p>

            <button type="submit" id="submit-btn"
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold p-3 rounded-xl transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-check"></i> เปลี่ยนรหัสผ่าน
            </button>
        </form>
    </div>

    <script>
        const API_BASE = window.location.origin;

        document.getElementById("change-form").addEventListener("submit", async (e) => {
            e.preventDefault();

            const currentPassword = document.getElementById("current-password").value;
            const newPassword = document.getElementById("new-password").value;
            const confirmPassword = document.getElementById("confirm-password").value;
            const resultMsg = document.getElementById("result-msg");
            const submitBtn = document.getElementById("submit-btn");

            resultMsg.classList.add("hidden");

            if (newPassword !== confirmPassword) {
                resultMsg.innerText = "⚠️ รหัสผ่านใหม่ทั้ง 2 ช่องไม่ตรงกัน";
                resultMsg.className = "text-center text-sm font-bold p-3 rounded-xl bg-red-900/50 border border-red-500 text-red-200";
                resultMsg.classList.remove("hidden");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> กำลังบันทึก...`;

            try {
                const res = await fetch(`${API_BASE}/api/change-password`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({ current_password: currentPassword, new_password: newPassword })
                });
                const data = await res.json();

                if (!res.ok) throw new Error(data.detail || "เปลี่ยนรหัสผ่านไม่สำเร็จ");

                resultMsg.innerText = "✅ เปลี่ยนรหัสผ่านสำเร็จแล้ว";
                resultMsg.className = "text-center text-sm font-bold p-3 rounded-xl bg-emerald-900/50 border border-emerald-500 text-emerald-200";
                resultMsg.classList.remove("hidden");
                document.getElementById("change-form").reset();

            } catch (err) {
                resultMsg.innerText = `⚠️ ${err.message}`;
                resultMsg.className = "text-center text-sm font-bold p-3 rounded-xl bg-red-900/50 border border-red-500 text-red-200";
                resultMsg.classList.remove("hidden");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i class="fa-solid fa-check"></i> เปลี่ยนรหัสผ่าน`;
            }
        });
    </script>
</body>
</html>
